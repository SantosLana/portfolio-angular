<mat-sidenav-container class="container">

  <mat-sidenav #menu mode="over">

    <h3>Meu Portfólio</h3>

    <a mat-button
       routerLink="/"
       routerLinkActive="ativo"
       [routerLinkActiveOptions]="{ exact: true }"
       (click)="menu.close()">
      Início
    </a>

    <a mat-button
       routerLink="/sobre"
       routerLinkActive="ativo"
       (click)="menu.close()">
      Sobre
    </a>

    <a mat-button
       routerLink="/projetos"
       routerLinkActive="ativo"
       (click)="menu.close()">
      Projetos
    </a>

    <a mat-button
       routerLink="/contato"
       routerLinkActive="ativo"
       (click)="menu.close()">
      Contato
    </a>

    <a mat-button
       routerLink="/catalogo"
       routerLinkActive="ativo"
       (click)="menu.close()">
      Catalogo
    </a>

  </mat-sidenav>

  <mat-sidenav-content>

    <mat-toolbar>

      <button mat-icon-button (click)="menu.toggle()">
        <mat-icon>menu</mat-icon>
      </button>

      <span>Meu Portfólio</span>

      <span class="espacador"></span>

      <!-- Menu desktop -->
      <div class="menu-desktop">

        <a mat-button
           routerLink="/"
           routerLinkActive="ativo"
           [routerLinkActiveOptions]="{ exact: true }">
          Início
        </a>

        <a mat-button
           routerLink="/sobre"
           routerLinkActive="ativo">
          Sobre
        </a>

        <a mat-button
           routerLink="/projetos"
           routerLinkActive="ativo">
          Projetos
        </a>

        <a mat-button
           routerLink="/contato"
           routerLinkActive="ativo">
          Contato
        </a>

        <a mat-button
           routerLink="/catalogo"
           routerLinkActive="ativo">
          Catálogo
        </a>

      </div>

    </mat-toolbar>

    <main class="conteudo">
      <router-outlet></router-outlet>
    </main>

  </mat-sidenav-content>

</mat-sidenav-container>
